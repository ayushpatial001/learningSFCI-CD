<template>
    <lightning-card title="Menu-detail">
        
        <template if:true={detail}>
             <div class="slds-grid slds-wrap">
               <template for:each={detail} for:item="foodRecord">
                      <div class="slds-size_1-of-4  slds-text-align_center maindiv" key={foodRecord.Id} >
                        <lightning-card title={foodRecord.Name} >
                            <div>
                                <lightning-formatted-rich-text class="imgdiv" value={foodRecord.Item_Image__c} ></lightning-formatted-rich-text>
                            </div>
                            <p>Price = <b>{foodRecord.Price__c}</b></p>
                            <p>Quantity = <b>{foodRecord.quantity}</b></p>
                        </lightning-card>  
                      </div>
                </template>

           </div> 
           <p>TotalAmount -- <b>{TotalPrice}</b></p>
           <div class="slds-text-align_center  slds-m-around_medium">
            <lightning-button  variant="brand" label="Submit order" title="Primary action" onclick={handleClick} class="slds-m-left_x-small" ></lightning-button>
            <lightning-button variant="destructive" label="Back To menu" title="Primary action" onclick={handleClick1} class="slds-m-left_x-small" ></lightning-button>                       
           </div>
           
        </template>
    </lightning-card>
</template>
