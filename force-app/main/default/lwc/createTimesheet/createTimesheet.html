<template>
    <template if:true={isModalOpen}>
        <!-- Modal/Popup Box LWC starts here -->
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <!-- Modal/Popup Box LWC header here -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={Modaltag}>
                        <lightning-icon icon-name="utility:close"
                            alternative-text="close"
                            variant="inverse"
                            size="small" ></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Employee Details</h2>
                </header>
                <!-- Modal/Popup Box LWC body starts here -->
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">  
                    <lightning-record-picker
                   object-api-name="Project__c"
                   placeholder="Search..."
                   label="Select a record"
                   onchange={handleChange}>
                   </lightning-record-picker>
                   <lightning-input label="TotalHour" ></lightning-input>
                   <lightning-input label="description" onchange ={descriptionHandler}></lightning-input>
                  
                   
                   
                </div>  
                <!-- Modal/Popup Box LWC footer starts here -->
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={closeModal} title="Save">Save</button>
                    <button class="slds-button slds-button_neutral" onclick={SaveandNewModal} title="SaveNew">SaveNew</button>
                    <button class="slds-button slds-button_brand" onclick={submitDetails} title="Cancel">Cancel</button>
                </footer>
            </div>
        </section>
        
    </template>
    
</template>
