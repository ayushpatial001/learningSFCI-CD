<template>
    <lightning-card title="Card-detail">
        
        <template if:true={detail}>
            <lightning-datatable
            hide-checkbox-column="true"
            key-field = "id"
            data={detail}
            columns={columns}
            onrowaction={removeElement}
            >

            </lightning-datatable>

            <div class="slds-text-align_center">
                <p style="margin-top: 5px; margin-bottom: 5px;">SGST = <strong>{sgst}%</strong></p>
                <p style=" margin-bottom: 5px;">CGST = <strong>{cgst}%</strong></p>
                <p><b>Total </b>= <strong>{totalPrice}</strong></p>
             
            </div>
        </template>
        <div style="margin: auto;
                    width: 50%;     
                   padding: 35px;">
            <lightning-button label="Checkout" variant="brand" onclick={onHandleclick} class="slds-m-left_x-small " ></lightning-button>
        </div>
        
      
    </lightning-card>
</template>
