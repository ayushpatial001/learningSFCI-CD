<template>
     
    <lightning-card title="Property" icon-name="standard:address">
        <lightning-button label="New" slot="actions" onclick={handleClick} ></lightning-button>
        <div class="slds-grid slds-wrap">
            <template for:each={data} for:item="obj1">
                <div class="slds-col slds-size_1-of-3 slds-p-around_medium" key={obj1.Id}>
                    <div class="slds-box slds-box_x-small">
                        <lightning-formatted-rich-text data-propertyid={obj1.Id} value={obj1.Image__c} onclick={getParticularPropertyData}></lightning-formatted-rich-text>
                        <p>{obj1.Name}</p>
                        <p>{obj1.Address__c}</p>
                        <span>Price - {obj1.Price__c}</span><br>
                        <span>Total Rooms - {obj1.Total_Rooms__c}</span>
                    </div>
                </div>
            </template>
        </div>
    </lightning-card>

    <template if:true={newProperty}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
       <div class="slds-modal__container">
        <!-- modal header start -->
          <header class="slds-modal__header">
            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={hideModalBox}>
                <lightning-icon icon-name="utility:close"
                   alternative-text="close"
                   variant="inverse"
                   size="small" ></lightning-icon>
                <span class="slds-assistive-text">Close</span>
             </button>  
          </header>
      
          <!-- modal body start -->
          <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                 <lightning-flow
                 flow-api-name='New_Property_Flow'
                 onstatuschange={handleStatusChange}
              ></lightning-flow>
          </div>

          
       
       </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>      
    </template>
