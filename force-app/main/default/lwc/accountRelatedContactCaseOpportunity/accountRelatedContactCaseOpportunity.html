<template>
    <lightning-card title="Account">{accountName}
        <div>
        <div>Contact Name</div>
        <template if:true={contactName}>
            <template for:each={contactName} for:item="contact">
                <p key={contact.Id}>{contact.Name}</p>
            </template>          
        </template>
    </div>
     <div>
        <div>Case Id</div>
        <template if:true={caseId}>
            <template for:each={caseId} for:item="caseName">
                <p key={caseName.Id}>{caseName.Id}</p>
            </template>          
        </template>
    </div>
    <div>
        <div>Opportuinty Name</div>
        <template if:true={opportuintyName}>
            <template for:each={opportuintyName} for:item="opp">
                <p key={opp.Id}>{opp.Name}</p>
            </template>          
        </template>
    </div>
    
    </lightning-card>
   

    
</template>
