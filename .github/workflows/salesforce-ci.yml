name: Salesforce CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  salesforce-ci:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Install Node.js (required for Salesforce CLI)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Install Salesforce CLI
      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      # 4️⃣ Verify Salesforce CLI installation
      - name: Check Salesforce CLI version
        run: sf --version

      # 5️⃣ Authenticate to Salesforce using JWT
      - name: Authenticate to Salesforce Org
        run: |
          echo "${{ secrets.SF_JWT_KEY_BASE64 }}" | base64 --decode > server.key
          sf org login jwt \
            --client-id ${{ secrets.SF_CLIENT_ID }} \
            --jwt-key-file server.key \
            --username ${{ secrets.SF_USERNAME }} \
            --instance-url https://test.salesforce.com \
            --set-default

      # 6️⃣ Verify org connection
      - name: Display Org Info
        run: sf org display --target-org ${{ secrets.SF_USERNAME }}

      # 7️⃣ Run Apex Tests
      - name: Run Apex Tests
        run: sf apex run test --test-level RunLocalTests --wait 30

      # 8️⃣ (Optional) Deploy source to org
      # Uncomment if you want deployment in CI
      # - name: Deploy Source
      #   run: sf project deploy start --source-dir force-app --wait 30
