name: Salesforce CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  salesforce-ci:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout Code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Install Salesforce CLI
      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      # 4️⃣ Verify Salesforce CLI
      - name: Check Salesforce CLI version
        run: sf --version

      # 5️⃣ Authenticate to Salesforce using JWT
      - name: Authenticate to Salesforce Org
        run: |
          echo "${{ secrets.SF_JWT_KEY_BASE64 }}" | base64 --decode > server.key
          sf org login jwt \
            --client-id ${{ secrets.SF_CLIENT_ID }} \
            --jwt-key-file server.key \
            --username ${{ secrets.SF_USERNAME }} \
            --instance-url https://test.salesforce.com \
            --set-default

      # 6️⃣ Read PR description or commit message
      - name: Read PR / Commit Message
        id: pr_message
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            MESSAGE="${{ github.event.pull_request.body }}"
          else
            MESSAGE="$(git log -1 --pretty=%B)"
          fi

          echo "PR_MESSAGE<<EOF" >> $GITHUB_OUTPUT
          echo "$MESSAGE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 7️⃣ Detect Apex changes
      - name: Detect Apex changes
        id: apex_check
        run: |
          git fetch origin main
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)

          echo "$CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -E 'force-app/main/default/(classes|triggers)/'; then
            echo "apex_changed=true" >> $GITHUB_OUTPUT
          else
            echo "apex_changed=false" >> $GITHUB_OUTPUT
          fi

      # 8️⃣ Parse user test instruction
      - name: Parse test instruction
        id: test_parser
        run: |
          MESSAGE="${{ steps.pr_message.outputs.PR_MESSAGE }}"

          if echo "$MESSAGE" | grep -iq "noTestRun"; then
            echo "mode=skip" >> $GITHUB_OUTPUT
          elif echo "$MESSAGE" | grep -iq "tests:"; then
            TESTS=$(echo "$MESSAGE" | sed -n 's/.*tests:\(.*\)/\1/p' | tr -d ' ')
            echo "mode=custom" >> $GITHUB_OUTPUT
            echo "tests=$TESTS" >> $GITHUB_OUTPUT
          else
            echo "mode=missing" >> $GITHUB_OUTPUT
          fi

      # 9️⃣ Enforce rules (FAIL if Apex changed & no test info)
      - name: Validate test instruction
        if: steps.apex_check.outputs.apex_changed == 'true' && steps.test_parser.outputs.mode == 'missing'
        run: |
          echo "❌ Apex code changed but no test instruction provided."
          echo "Please add one of the following to PR description or commit message:"
          echo "1️⃣ noTestRun"
          echo "2️⃣ tests: MyTestClass1,MyTestClass2"
          exit 1

      # 🔟 Run specific Apex tests
      - name: Run specified Apex tests
        if: steps.test_parser.outputs.mode == 'custom'
        run: |
          echo "Running tests: ${{ steps.test_parser.outputs.tests }}"
          sf apex run test \
            --tests "${{ steps.test_parser.outputs.tests }}" \
            --wait 30

      # 1️⃣1️⃣ Skip tests explicitly
      - name: Skip Apex tests
        if: steps.test_parser.outputs.mode == 'skip'
        run: echo "⚠️ Apex tests skipped as per user instruction (noTestRun)"

      # 1️⃣2️⃣ No Apex change → no tests
      - name: No Apex changes detected
        if: steps.apex_check.outputs.apex_changed == 'false'
        run: echo "✅ No Apex changes detected. Tests not required."
